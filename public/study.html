<!DOCTYPE html>
<html lang="el"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnerDesk — Μελέτη</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/study.css">
<script>MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script>
</head>
<body class="study">
<div id="site-header"></div>
<div class="container">
  <div class="left-panel">
    <div class="pdf-container" id="pdfContainer">
      <div class="upload-placeholder" id="placeholder"><div style="font-size:50px">📄</div><p id="placeholderTxt" data-i18n="st_placeholder"></p></div>
      <iframe id="pdfViewer" style="display:none" title="PDF"></iframe>
    </div>
  </div>
  <div class="right-panel">
    <!-- Προβολή 1: νέο σετ -->
    <div class="new-view" id="viewNew">
      <div class="card">
        <h3 data-i18n="st_upload_title"></h3>
        <label class="field" style="margin-top:12px"><span data-i18n="st_choose"></span><input type="file" id="pdfFile" accept="application/pdf"></label>
        <div class="row">
          <label class="field" style="flex:1"><span data-i18n="st_from"></span><input type="number" id="pFrom" min="1" value="1"></label>
          <label class="field" style="flex:1"><span data-i18n="st_to"></span><input type="number" id="pTo" min="1" value="1"></label>
        </div>
        <label class="row" style="margin-bottom:8px"><input type="checkbox" id="ocr"> <span id="ocrLbl" data-i18n="st_ocr"></span></label>
        <p class="muted" id="limitTxt"></p>
        <p class="muted" id="costTxt"></p>
        <div class="row" style="margin-top:12px"><button class="btn red" id="genBtn" disabled data-i18n="st_generate"></button><span id="genStatus"></span></div>
        <div id="genMsg"></div>
      </div>
      <div class="card"><h3 data-i18n="st_my_sets"></h3><div id="setList"></div></div>
    </div>
    <!-- Προβολή 2: περιβάλλον μελέτης -->
    <div id="viewSet" style="display:none;flex:1;min-height:0;flex-direction:column">
      <div class="toolbar">
        <button class="mode-btn" id="btnNew">＋</button>
        <span id="setTitle" style="font-weight:700;margin:0 8px"></span>
        <span style="width:2px;height:22px;background:#ddd"></span>
        <button class="mode-btn active" data-mode="study" data-i18n="m_study"></button>
        <button class="mode-btn" data-mode="tf" data-i18n="m_tf"></button>
        <button class="mode-btn" data-mode="mcq" data-i18n="m_mcq"></button>
        <button class="mode-btn" data-mode="fill" data-i18n="m_fill"></button>
        <button class="mode-btn" data-mode="cloze" data-i18n="m_cloze"></button>
        <button class="mode-btn" data-mode="free" data-i18n="m_free"></button>
      </div>
      <div class="scroll-viewport"><div class="scroll-content">
        <div class="col-headers-row"><div class="col-header-title" data-i18n="col_theory"></div><div class="col-header-title" data-i18n="col_ex"></div><div class="col-header-title" data-i18n="col_eval"></div></div>
        <div class="content-area" id="content-area"></div>
      </div></div>
    </div>
  </div>
</div>
<div class="global-footer">
  <div class="footer-left"><strong id="footTitle">📄 LearnerDesk</strong>
    <label for="pdfLoad" class="upload-btn" data-i18n="st_load_pdf"></label><input type="file" id="pdfLoad" accept="application/pdf" style="display:none"></div>
  <div class="footer-right">
    <label for="audioUpload" class="upload-btn" id="audioLbl">🎵 Audio</label><input type="file" id="audioUpload" accept="audio/*" style="display:none">
    <button id="playPauseBtn" class="audio-btn" style="display:none">▶️</button><button id="rewindBtn" class="audio-btn" style="display:none">⏪ 10s</button><button id="forwardBtn" class="audio-btn" style="display:none">10s ⏩</button>
  </div>
</div>
<audio id="audioPlayer" style="display:none"></audio>
<script src="/assets/study.js"></script>
</body></html>
