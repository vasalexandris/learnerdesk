<!DOCTYPE html>
<html lang="el"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script>
<title>LearnerDesk — Admin</title>
</head><body>
<div id="site-header"></div>
<main class="wrap" style="max-width:1100px">
  <h2>Admin</h2>
  <div class="grid3" id="stats"></div>
  <h3 style="margin:24px 0 8px">Users</h3>
  <div class="card" style="overflow-x:auto"><table class="list"><thead><tr><th>Email</th><th>Plan</th><th>Until</th><th>Created</th><th></th></tr></thead><tbody id="users"></tbody></table></div>
  <h3 style="margin:24px 0 8px">Payments</h3>
  <div class="card" style="overflow-x:auto"><table class="list"><thead><tr><th>Date</th><th>Item</th><th>€</th><th>Status</th></tr></thead><tbody id="pays"></tbody></table></div>
  <div id="msg"></div>
</main>
<script>
LD.renderHeader('admin');
const E = LD.esc;
const note = (t, ok) => { document.getElementById('msg').innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${E(t)}</div>`; };
async function load() {
  await LD.requireSession();
  const [s, u, p] = await Promise.all([LD.api('/admin/stats'), LD.api('/admin/users'), LD.api('/admin/payments')]);
  const l = s.last30d;
  document.getElementById('stats').innerHTML = [['AI calls (30d)', l.ai_calls + ' (' + l.ai_failed + ' failed)'], ['Credits spent', l.credits_spent], ['Revenue (30d)', (l.revenue_cents / 100).toFixed(2) + ' €'], ['Active paid subs', s.active_paid_subscriptions]]
    .map(([k, v]) => `<div class="card"><div class="muted">${E(k)}</div><div class="price">${E(v)}</div></div>`).join('');
  document.getElementById('users').innerHTML = u.users.map(x => `<tr><td>${E(x.email)}</td><td>${E(x.subscription ? x.subscription.plan + (x.subscription.source === 'admin' ? ' (admin)' : '') : 'free')}</td>
    <td>${x.subscription && x.subscription.current_period_end ? new Date(x.subscription.current_period_end).toLocaleDateString() : ''}</td><td>${new Date(x.created_at).toLocaleDateString()}</td>
    <td style="white-space:nowrap"><button class="btn ghost" data-act="plan" data-id="${E(x.id)}">Grant plan</button> <button class="btn ghost" data-act="credits" data-id="${E(x.id)}">+Credits</button> <button class="btn ghost" data-act="del" data-id="${E(x.id)}">Delete</button></td></tr>`).join('');
  document.getElementById('pays').innerHTML = p.payments.map(x => `<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${E(x.item_id)}</td><td>${(x.amount_cents / 100).toFixed(2)}</td><td>${E(x.status)}</td></tr>`).join('');
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, b.dataset.id));
}
async function act(kind, id) {
  try {
    if (kind === 'plan') {
      const plan = prompt('Plan (student | pro | free):', 'pro'); if (!plan) return;
      const days = prompt('Days:', '30'); if (!days) return;
      await LD.api('/admin/grant-plan', { method: 'POST', body: { user_id: id, plan, days: +days } });
    } else if (kind === 'credits') {
      const n = prompt('Credits:', '100'); if (!n) return;
      await LD.api('/admin/grant-credits', { method: 'POST', body: { user_id: id, credits: +n } });
    } else if (kind === 'del') {
      if (!confirm('Delete this user and ALL their data?')) return;
      await LD.api('/admin/users/' + id, { method: 'DELETE' });
    }
    note('OK', true); load();
  } catch (e) { note(e.message, false); }
}
load().catch(e => note(e.status === 403 ? 'Forbidden' : e.message, false));
</script></body></html>
